name: mingo
x-backend: &backend
  build: ./backend
  environment: &backend-env
    DATABASE_URL: postgresql://mingo_app:${MINGO_APP_PASSWORD:?Set MINGO_APP_PASSWORD in .env}@db:5432/mingo
    TEST_DATABASE_URL: postgresql://mingo_app:${MINGO_APP_PASSWORD:?Set MINGO_APP_PASSWORD in .env}@db:5432/mingo_test
    OBJECT_STORAGE_ROOT: /data/objects
  volumes:
    - objects:/data/objects
services:
  db:
    image: postgres:16.10
    environment:
      POSTGRES_USER: mingo_app
      POSTGRES_DB: mingo
      POSTGRES_PASSWORD: ${MINGO_APP_PASSWORD:?Set MINGO_APP_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mingo_app -d mingo']
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: [python, -m, all_foundation.cli, migrate]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *backend
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 4s
      retries: 10
  worker:
    <<: *backend
    command: [python, -m, all_foundation.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -m, all_foundation.worker, --healthcheck]
      interval: 5s
      timeout: 4s
      retries: 10
volumes:
  postgres:
  objects:
