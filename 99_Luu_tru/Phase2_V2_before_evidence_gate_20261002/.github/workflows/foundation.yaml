name: phase1-foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: mingo_app
          POSTGRES_PASSWORD: ci_disposable_password
          POSTGRES_DB: mingo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mingo_app -d mingo"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://mingo_app:ci_disposable_password@localhost:5432/mingo_test
      DATABASE_URL: postgresql://mingo_app:ci_disposable_password@localhost:5432/mingo
      OBJECT_STORAGE_ROOT: ${{ github.workspace }}/.local/objects
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r 01_San_pham/backend/requirements.lock && pip install --no-deps ./01_San_pham/backend
      - name: Create disposable test database
        run: >-
          python -c "import psycopg;
          c=psycopg.connect('${{ env.DATABASE_URL }}', autocommit=True);
          c.execute('CREATE DATABASE mingo_test OWNER mingo_app'); c.close()"
      - run: RUN_POSTGRES=1 bash 04_Van_hanh/Scripts/verify_backend.sh
      - run: python -m all_foundation.cli migrate
      - run: python -m all_foundation.cli enqueue-probe --key ci-boot
      - run: python -m all_foundation.worker --once
      - run: python 04_Van_hanh/Scripts/smoke_api.py --expect-ready
      - run: python -m all_foundation.cli storage-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-evidence
          path: 03_Kiem_thu/Bang_chung/
  flutter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [learner, staff]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
      - run: bash 04_Van_hanh/Scripts/bootstrap_clients.sh
      - if: matrix.app == 'learner'
        working-directory: 01_San_pham/cong_cu_phat_trien/mingo_ui
        run: |
          flutter pub get
          flutter analyze
          flutter test test/fixture_test.dart
      - working-directory: 01_San_pham/apps/${{ matrix.app }}
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web
      - if: matrix.app == 'learner'
        working-directory: 01_San_pham/apps/learner
        run: flutter build apk --debug
  original-v3-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: pip install -r 04_Van_hanh/requirements-v3_2.lock && pip check
      - run: python -m unittest discover -s 04_Van_hanh/tests -v
      - run: python 04_Van_hanh/Scripts/check_original_contracts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-v3-2-evidence
          path: 03_Kiem_thu/Bang_chung/v3_2/
  phase2-v2-windows-presentation:
    # Captures were generated with Windows Flutter 3.32.8; compare on the same platform.
    runs-on: windows-latest
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
      - working-directory: 01_San_pham/cong_cu_phat_trien/mingo_ui
        run: |
          flutter pub get
          flutter analyze
          flutter test --reporter json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-v2-presentation
          path: |
            03_Kiem_thu/QA_QC/phase2/rebaseline_v2_20261001/screenshots/
            01_San_pham/cong_cu_phat_trien/mingo_ui/test/failures/
