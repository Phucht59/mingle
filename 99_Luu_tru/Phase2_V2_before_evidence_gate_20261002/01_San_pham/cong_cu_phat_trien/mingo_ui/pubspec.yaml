name: mingo_ui
description: Mingo Quiet Exploration shared presentation, fixtures and review catalogue.
publish_to: none
version: 2.0.0
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  audioplayers: 6.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/mascot.png
    - assets/exploration.png
    - assets/hello.ogg
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
