name: Bug
description: Reproducible engineering defect
title: "[BUG] "
labels: []
body:
  - type: input
    id: linear
    attributes:
      label: Linear source / incident
      placeholder: TRA-123 or N/A
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Build/commit, device/browser, OS, network/offline state
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, failing test, trace
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [BLOCKER, HIGH, MEDIUM, LOW]
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Regression / contract impact
      description: Which V3.2/PRD/BR/UC invariant is affected?
