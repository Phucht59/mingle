name: phase1-foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: mingo_app
          POSTGRES_PASSWORD: ci_disposable_password
          POSTGRES_DB: mingo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mingo_app -d mingo"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://mingo_app:ci_disposable_password@localhost:5432/mingo_test
      DATABASE_URL: postgresql://mingo_app:ci_disposable_password@localhost:5432/mingo
      OBJECT_STORAGE_ROOT: ${{ github.workspace }}/.local/objects
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r 05_code/backend/requirements.lock && pip install --no-deps ./05_code/backend
      - name: Create disposable test database
        run: >-
          python -c "import psycopg;
          c=psycopg.connect('${{ env.DATABASE_URL }}', autocommit=True);
          c.execute('CREATE DATABASE mingo_test OWNER mingo_app'); c.close()"
      - run: RUN_POSTGRES=1 bash 07_operations/scripts/verify_backend.sh
      - run: python -m all_foundation.cli migrate
      - run: python -m all_foundation.cli enqueue-probe --key ci-boot
      - run: python -m all_foundation.worker --once
      - run: python 07_operations/scripts/smoke_api.py --expect-ready
      - run: python -m all_foundation.cli storage-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-evidence
          path: 06_quality/evidence/
  flutter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [learner, staff]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
      - run: bash 07_operations/scripts/bootstrap_clients.sh
      - working-directory: 05_code/apps/${{ matrix.app }}
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web
      - if: matrix.app == 'learner'
        working-directory: 05_code/apps/learner
        run: flutter build apk --debug
  original-v3-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: pip install -r 07_operations/requirements-v3_2.lock && pip check
      - run: python -m unittest discover -s 07_operations/tests -v
      - run: python 07_operations/scripts/check_original_contracts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-v3-2-evidence
          path: 06_quality/evidence/v3_2/
